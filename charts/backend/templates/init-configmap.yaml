apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-init-script
  labels:
    app: {{ .Release.Name }}
    {{- include "labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
data:
  init.sh: |
    #!/bin/sh
    echo Wait for twi app to be ready
    {{- $svcName := default .Chart.Name  }}
    {{- $svcNS := default .Release.Namespace }}
    {{- $svcPort := int (default 8000 .Values.service.port) }}
    {{- $svcFQDN := printf "%s.%s.svc.cluster.local:%d" $svcName $svcNS $svcPort }}
    until curl -sf http://{{ $svcFQDN }}/twi/; do
      echo "{\"level\":\"info\", \"message\":\"Waiting for {{ .Release.Name }} to be ready\"}"
      sleep 10
    done
    echo '{"level":"info", "message": "Created first twi"}'
    curl -s -X POST 'http://{{ $svcFQDN }}/twi/' \
      -H 'accept: application/json' -H 'Content-Type: application/json' \
      -d '{"post_text": "First test twi"}'
    echo '{"level":"info", "message":"Init completed"}'
