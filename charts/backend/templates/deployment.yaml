apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    alloy.io/scrape: "true"
    loki.io/logs: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.listenPort | default "8000" | quote }}
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name  | quote }}
      app.kubernetes.io/name: {{ .Chart.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/name: {{ .Chart.Name | quote }}
      annotations:
        alloy.io/scrape: "true"
        loki.io/logs: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.listenPort | default "8000" | quote }}
        prometheus.io/path: "/metrics"
        vault.hashicorp.com/log-format: 'json'
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-inject-env: 'true'
        vault.hashicorp.com/role: 'myapp'
        vault.hashicorp.com/auth-config-path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        serviceAccountName: "default"
        vault.hashicorp.com/service-account-token-audience: "https://kubernetes.default.svc.cluster.local"
        vault.hashicorp.com/agent-init-first: 'true'
        vault.hashicorp.com/agent-inject-containers: 'backend,db'
        vault.hashicorp.com/agent-inject-secret-config: 'secret/data/cluster/py/db'
        vault.hashicorp.com/template-static-secret-render-interval: '1m'
        vault.hashicorp.com/agent-inject-command-config: '/bin/kill -HUP $(pidof python); /bin/kill -HUP $(pidof postgres); echo "Secrets reloaded"'
        vault.hashicorp.com/agent-inject-check-interval: '1m'
        vault.hashicorp.com/agent-inject-template-config: |
          {{ "{{-" }} with secret "secret/data/cluster/py/db" -}}
            export POSTGRES_DB={{ "{{" }} .Data.data.POSTGRES_DB }}
            export POSTGRES_PASSWORD={{ "{{" }} .Data.data.POSTGRES_PASSWORD }}
            export POSTGRES_USER={{ "{{" }} .Data.data.POSTGRES_USER }}
            export POSTGRES_HOST={{ "{{" }} .Data.data.POSTGRES_HOST }}
          {{ "{{" }}- end }}
    spec:
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-{{ .Chart.Name }}"
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: init-script
          configMap:
            name: "{{ .Release.Name }}-{{ .Chart.Name }}-init-script"
            defaultMode: 0755
      #securityContext:
      #  fsGroup: 200
      containers:
        - name: {{ .Chart.Name | quote }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.service.listenPort | default "8000" }}
              name: http
          command:
            ['sh', '-c']
          args:
            ['source /vault/secrets/config && /app/start.sh']
          env:
            - name: PORT
              value: {{ .Values.service.listenPort | default "8000" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
                path: /
                port: {{ .Values.service.listenPort | default "8000" }}
            periodSeconds: 30
          livenessProbe:
            httpGet:
                path: /
                port: {{ .Values.service.listenPort | default "8000" }}
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: db
          command:
            ["/bin/bash", "-c"]
          args:
            ['source /vault/secrets/config && exec docker-entrypoint.sh postgres']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
