apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    app.kubernetes.io/app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/component: {{ include "backend.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    alloy.io/scrape: "true"
    loki.io/logs: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "backend.fullname" . }}
        app.kubernetes.io/app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/part-of: {{ .Chart.Name }}
        app.kubernetes.io/component: {{ include "backend.fullname" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        alloy.io/scrape: "true"
        loki.io/logs: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "backend.fullname" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: init-script
          configMap:
            name: {{ .Release.Name }}-init-script
            defaultMode: 0755
      #securityContext:
      #  fsGroup: 200
      containers:
        - name: {{ include "backend.fullname" . }}
          image:  pybe #"{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.service.listenPort | default "8000" }}
              name: http
          env:
            - name: POSTGRES_DB
              value: djangodb
            - name: POSTGRES_HOST
              value: localhost
            - name:  POSTGRES_USER
              value: django
            - name:  POSTGRES_PASSWORD
              value: "12345"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
                path: /
                port: 8000 #{{ .Values.service.listenPort | default "8000" }}
            periodSeconds: 30
          livenessProbe:
            httpGet:
                path: /
                port: 8000 #{{ .Values.service.listenPort | default "8000" }}
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: db
          env:
            - name: POSTGRES_DB
              value: djangodb
            - name:  POSTGRES_USER
              value: django
            - name:  POSTGRES_PASSWORD
              value: "12345"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
